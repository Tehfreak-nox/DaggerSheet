<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create character — assign traits</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=Cinzel:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="dh" data-theme="{{theme}}" style="width: 390px; height: 960px; display: flex; flex-direction: column; overflow: hidden">

  <header class="topbar">
    <button class="iconbtn press" aria-label="Exit character creation"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="lbl lbl-ink" style="font-size: 15px">New character</div>
    <span class="num muted" style="width: 44px; text-align: center; font-size: 16px">3/9</span>
  </header>

  <div style="padding: 0 16px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
    <span style="height: 6px; border-radius: 3px; background: var(--ink)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--ink)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--hope)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--line)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--line)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--line)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--line)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--line)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--line)"></span>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px 16px 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Step 3 · Traits</span>
      <h1 class="h1" style="margin: 0">Assign your traits</h1>
      <p class="muted" style="margin: 0; font-size: 14px; line-height: 1.45">Pick up a modifier, then tap a trait to place it. Tap a placed modifier to return it to the tray.</p>
    </div>

    <!-- Tray -->
    <section class="card-inset" style="padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span class="lbl lbl-ink">Modifier tray</span>
        <span class="muted" style="font-size: 12px">{{trayLeft}} left</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; min-height: 56px">
        <sc-for list="{{tray}}" as="m" hint-placeholder-count="6">
          <button class="token press {{m.cls}}" style="width: 52px; height: 52px; {{m.style}}" aria-pressed="{{m.pressed}}" aria-label="Modifier {{m.label}}" onClick="{{m.pick}}"><span class="num" style="font-size: 22px">{{m.label}}</span></button>
        </sc-for>
      </div>
    </section>

    <!-- Trait slots -->
    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{slots}}" as="t" hint-placeholder-count="6">
        <button class="trait press" style="min-height: 92px; flex-direction: row; justify-content: space-between; padding: 10px 12px; {{t.ring}}" onClick="{{t.tap}}" aria-label="{{t.name}}: {{t.aria}}">
          <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left">
            <span class="lbl lbl-ink" style="font-size: 15px">{{t.name}}</span>
            <span class="muted" style="font-size: 11px; line-height: 1.25">{{t.verbs}}</span>
          </span>
          <span style="width: 48px; height: 48px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; {{t.slotStyle}}"><span class="num" style="font-size: 22px">{{t.val}}</span></span>
        </button>
      </sc-for>
    </section>

    <div class="card-inset" style="padding: 10px 12px; font-size: 13px; line-height: 1.4"><strong>Bard tip:</strong> <span class="muted">Presence powers your class spells and weapon — a common pick for the +2.</span></div>

    <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
      <button class="btn press">Back</button>
      <button class="btn btn-primary press" style="{{nextStyle}}" aria-disabled="{{nextDisabled}}">{{nextLabel}}</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["neutral","parchment","midnight"],"default":"neutral","section":"Theme"},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // modifier tokens: id → value
    this.mods = [2, 1, 1, 0, 0, -1];
    this.state = { placed: { Presence: 0, Knowledge: 1 }, held: 2 };
  }
  renderVals() {
    const s = this.state;
    const fmt = (n) => (n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '+0');
    const used = Object.values(s.placed);
    const traits = [
      ['Agility', 'Sprint · Leap · Maneuver'], ['Strength', 'Lift · Smash · Grapple'], ['Finesse', 'Control · Hide · Tinker'],
      ['Instinct', 'Perceive · Sense · Navigate'], ['Presence', 'Charm · Perform · Deceive'], ['Knowledge', 'Recall · Analyze · Comprehend']
    ];
    const free = this.mods.map((v, id) => ({ v, id })).filter((m) => !used.includes(m.id));
    const done = free.length === 0;
    return {
      theme: this.props.theme ?? 'neutral',
      trayLeft: free.length,
      tray: free.map((m) => {
        const held = s.held === m.id;
        return {
          label: fmt(m.v), cls: held ? 'on' : '', pressed: held ? 'true' : 'false',
          style: held ? 'transform: translateY(-4px)' : '',
          pick: () => this.setState({ held: held ? null : m.id })
        };
      }),
      slots: traits.map(([name, verbs]) => {
        const id = s.placed[name];
        const has = id !== undefined;
        const canDrop = !has && s.held !== null && s.held !== undefined;
        return {
          name, verbs,
          val: has ? fmt(this.mods[id]) : '',
          aria: has ? fmt(this.mods[id]) + ', tap to return' : (canDrop ? 'tap to place' : 'empty'),
          slotStyle: has ? 'background: var(--ink); color: var(--card); box-shadow: inset 0 0 0 3px var(--card); border: 2.5px solid var(--ink)' : 'border: 2.5px dashed var(--line)',
          ring: canDrop ? 'border-color: var(--hope); border-style: dashed' : '',
          tap: () => {
            if (has) {
              const p = Object.assign({}, s.placed); delete p[name];
              this.setState({ placed: p, held: id });
            } else if (canDrop) {
              this.setState({ placed: Object.assign({}, s.placed, { [name]: s.held }), held: null });
            }
          }
        };
      }),
      nextLabel: done ? 'Next: Additional info' : 'Place all 6 modifiers',
      nextStyle: done ? '' : 'opacity: .45',
      nextDisabled: done ? 'false' : 'true'
    };
  }
}
</script>
</body>
</html>

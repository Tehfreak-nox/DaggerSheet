<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Combat strip</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=Cinzel:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="dh" data-theme="{{theme}}" style="width: 390px; height: 1040px; display: flex; flex-direction: column; overflow: hidden">

  <header class="topbar">
    <a href="Main.dc.html" class="iconbtn press" aria-label="Back to sheet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="lbl lbl-ink" style="font-size: 15px">Combat</div>
    <span style="width: 44px"></span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 20px">

    <!-- At-a-glance strip -->
    <section class="card" style="padding: 10px 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span class="num" style="font-size: 26px">10</span><span class="lbl" style="font-size: 11px">Evasion</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; border-left: 1px solid var(--line)"><span class="num" style="font-size: 26px; color: var(--hp)">2<span class="muted" style="font-size: 16px">/6</span></span><span class="lbl" style="font-size: 11px">HP</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; border-left: 1px solid var(--line)"><span class="num" style="font-size: 26px; color: var(--stress)">1<span class="muted" style="font-size: 16px">/6</span></span><span class="lbl" style="font-size: 11px">Stress</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; border-left: 1px solid var(--line)"><span class="num" style="font-size: 26px">1<span class="muted" style="font-size: 16px">/4</span></span><span class="lbl" style="font-size: 11px">Armor</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; border-left: 1px solid var(--line)"><span class="num" style="font-size: 26px; color: var(--hope-ink)">3</span><span class="lbl" style="font-size: 11px">Hope</span></div>
    </section>

    <!-- Weapons -->
    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 class="lbl" style="margin: 0">Equipped weapons</h2>
        <span class="hint">Tap damage to roll · Hold for crit</span>
      </div>

      <sc-for list="{{weapons}}" as="w" hint-placeholder-count="2">
        <article class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span class="lbl" style="font-size: 11px">{{w.slot}}</span>
              <span style="font-size: 18px; font-weight: 700">{{w.name}}</span>
              <div style="display: flex; flex-wrap: wrap; gap: 4px">
                <span class="tag">{{w.trait}}</span><span class="tag">{{w.range}}</span><span class="tag">{{w.kind}}</span><span class="tag">{{w.burden}}</span>
              </div>
            </div>
            <a href="Dice.dc.html" class="btn press" style="flex: none; min-height: 44px; padding: 0 12px; flex-direction: column; gap: 0" aria-label="Attack roll with {{w.trait}}">
              <span class="lbl" style="font-size: 10px">Attack</span>
              <span class="num" style="font-size: 20px">{{w.atk}}</span>
            </a>
          </div>

          <button class="press" style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: var(--radius-btn); border: var(--border-w) solid var(--line-strong); background: var(--card-2)" onPointerDown="{{w.down}}" onPointerUp="{{w.up}}" onPointerLeave="{{w.cancel}}" onKeyDown="{{w.key}}" onContextMenu="{{noMenu}}" aria-label="Roll damage {{w.formula}}. Hold for critical damage.">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><path d="M12 8l-5 9h10z"/></svg>
            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
              <span class="num" style="font-size: 30px">{{w.formula}}</span>
              <span class="muted" style="font-size: 12px">{{w.note}}</span>
            </div>
            <div style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
              <sc-if value="{{w.hasRoll}}" hint-placeholder-val="{{ false }}">
                <span class="num" style="font-size: 34px">{{w.total}}</span>
                <span class="muted" style="font-size: 11px">{{w.detail}}</span>
              </sc-if>
              <sc-if value="{{w.noRoll}}" hint-placeholder-val="{{ true }}">
                <span class="lbl" style="font-size: 12px">Damage</span>
              </sc-if>
            </div>
          </button>
          <div class="muted" style="font-size: 13px; line-height: 1.4"><strong style="color: var(--ink)">{{w.feature}}</strong> {{w.featureText}}</div>
        </article>
      </sc-for>
    </section>

    <!-- Domain loadout -->
    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 class="lbl" style="margin: 0">Loadout <span class="num lbl-ink" style="font-size: 15px">4/5</span></h2>
        <button class="lbl press" style="border: 0; background: transparent; min-height: 44px; padding: 0 4px">Vault · 2</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
          <button class="dcard press {{c.dom}}" style="width: auto; min-height: 150px; padding: 0; text-align: left" aria-label="{{c.name}}, {{c.domain}} level {{c.lv}} {{c.type}}">
            <span class="dcard-band"></span>
            <span style="padding: 8px 9px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1">
              <span style="display: flex; justify-content: space-between; align-items: center">
                <span class="lbl" style="font-size: 10px; color: var(--dc)">{{c.domain}}</span>
                <span class="num" style="font-size: 16px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--dc); display: inline-flex; align-items: center; justify-content: center">{{c.lv}}</span>
              </span>
              <span style="font-size: 14px; font-weight: 700; line-height: 1.15">{{c.name}}</span>
              <span class="muted" style="font-size: 11px">{{c.type}}</span>
              <span style="margin-top: auto; display: flex; gap: 4px; align-items: center">
                <sc-for list="{{c.tokens}}" as="t" hint-placeholder-count="0"><span class="slot sm {{t.cls}}" style="--c: var(--dc); border-radius: 50%"></span></sc-for>
              </span>
            </span>
          </button>
        </sc-for>
        <button class="dcard dcard-empty press" style="width: auto; min-height: 150px; gap: 6px; color: var(--ink-2)" aria-label="Add a domain card from the vault">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="lbl" style="font-size: 11px">From vault</span>
        </button>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a href="Main.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Sheet</a>
    <a href="Combat.dc.html" class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M14 4l6 0 0 6-9 9-3 0 0-3z"/><path d="M5 16l3 3M4 20l2-2"/></svg>Combat</a>
    <a href="Dice.dc.html" class="tab-roll press" aria-label="Roll dice"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><path d="M12 2v6M3.5 7L12 8l8.5-1M12 8l-5 9h10z"/></svg></a>
    <a href="Equipment.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>Gear</a>
    <a href="Resources.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="9" r="4"/><circle cx="16" cy="15" r="4"/></svg>Class</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["neutral","parchment","midnight"],"default":"neutral","section":"Theme"},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rolls: { primary: { dice: [6, 3], mod: 3, total: 12, crit: false } } };
  }
  roll(id, n, sides, mod, crit) {
    const dice = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * sides));
    const sum = dice.reduce((a, b) => a + b, 0) + (crit ? n * sides : 0) + mod;
    this.setState({ rolls: Object.assign({}, this.state.rolls, { [id]: { dice, mod, total: sum, crit } }) });
  }
  weapon(w) {
    const r = this.state.rolls[w.id];
    const go = (crit) => this.roll(w.id, w.n, w.sides, w.mod, crit);
    return Object.assign({}, w, {
      hasRoll: !!r, noRoll: !r, total: r ? r.total : '',
      detail: r ? ((r.crit ? 'CRIT +' + (w.n * w.sides) + ' · ' : '') + '[' + r.dice.join(', ') + '] +' + r.mod) : '',
      down: () => { this._lp = false; clearTimeout(this._t); this._t = setTimeout(() => { this._lp = true; go(true); }, 450); },
      up: () => { clearTimeout(this._t); if (this._lp === false) go(false); this._lp = true; },
      cancel: () => { clearTimeout(this._t); this._lp = true; },
      key: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(false); } }
    });
  }
  renderVals() {
    const tok = (n, on) => Array.from({ length: n }, (_, i) => ({ cls: i < on ? 'on' : '' }));
    return {
      theme: this.props.theme ?? 'neutral',
      noMenu: (e) => e.preventDefault(),
      weapons: [
        { id: 'primary', slot: 'Primary', name: 'Improved Rapier', trait: 'Presence', range: 'Melee', kind: 'Physical', burden: 'One-handed', atk: '+2', n: 2, sides: 8, mod: 3, formula: '2d8+3', note: 'Proficiency 2 × d8', feature: 'Feature:', featureText: '[feature text from your rulebook]' },
        { id: 'secondary', slot: 'Secondary', name: 'Small Dagger', trait: 'Finesse', range: 'Melee', kind: 'Physical', burden: 'One-handed', atk: '+1', n: 2, sides: 8, mod: 0, formula: '2d8', note: 'Proficiency 2 × d8', feature: 'Paired:', featureText: '[feature text from your rulebook]' }
      ].map((w) => this.weapon(w)),
      cards: [
        { name: 'Inspirational Words', domain: 'Grace', dom: 'dom-grace', lv: 1, type: 'Ability', tokens: tok(2, 2) },
        { name: 'Deft Deceiver', domain: 'Grace', dom: 'dom-grace', lv: 1, type: 'Ability', tokens: [] },
        { name: 'Book of Ava', domain: 'Codex', dom: 'dom-codex', lv: 1, type: 'Grimoire', tokens: [] },
        { name: 'Enrapture', domain: 'Grace', dom: 'dom-grace', lv: 1, type: 'Spell', tokens: [] }
      ]
    };
  }
}
</script>
</body>
</html>
